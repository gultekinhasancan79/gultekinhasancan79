<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-labelledby="title desc">
<title id="title">Hasancan Gültekin: RL environments and agent evaluation</title>
<desc id="desc">Profile header. An animated verifier replays the recorded swe-rl-envs v0.1.0 walkthrough: the seeded defect passes gates 1-6 and 14 of 23 tests (FAIL), the partial fix passes gates 1-7 and 21 of 23 tests (FAIL), and the reference fix passes all nine gates and 23 of 23 tests (PASS).</desc>
